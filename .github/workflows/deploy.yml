name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Variáveis do repositório (Settings → Secrets and variables → Actions → Variables)
      VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
      VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci || npm install
      - name: Conferir canal de pedidos
        run: |
          if [ -z "$VITE_WHATSAPP_NUMBER" ] && [ -z "$VITE_LEAD_ENDPOINT" ]; then
            echo "::error::Defina a variável VITE_WHATSAPP_NUMBER (ou VITE_LEAD_ENDPOINT) no repositório."
            exit 1
          fi
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
