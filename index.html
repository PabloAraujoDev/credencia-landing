<!doctype html>
<html lang="pt-BR" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Credenciamento de formaturas com QR Code e a sua marca | Credencia</title>
    <meta
      name="description"
      content="O formando cadastra convidados e assina o termo no celular. Sua equipe gera convites com QR Code e confere a entrada em segundos. Peça uma demonstração."
    />
    <meta name="theme-color" content="#0c0612" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Credencia" />
    <meta property="og:title" content="Credenciamento de formaturas com QR Code e a sua marca" />
    <meta
      property="og:description"
      content="Lista de convidados, termo assinado no celular, convite com QR Code de uso único e portaria — tudo com a marca da sua empresa."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Painel de credenciamento de formaturas e tela de portaria com entrada autorizada." />
    <meta name="twitter:card" content="summary_large_image" />
    <!--head-extra-->

    <script>
      // Ativa as animações de revelação só quando o JS roda; se o app não
      // iniciar em 3s, o conteúdo volta a ficar visível.
      document.documentElement.classList.replace('no-js', 'js')
      setTimeout(function () {
        if (!window.__appReady) document.documentElement.classList.remove('js')
      }, 3000)
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <noscript>
      <style>
        .strike { background-size: 100% 2px; }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
